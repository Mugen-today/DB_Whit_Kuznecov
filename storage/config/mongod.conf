# Cache size is passed through Compose CLI, not interpolated in this YAML.
storage:
  dbPath: /data/db
  engine: wiredTiger
  wiredTiger:
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true
net:
  port: 27017
  bindIpAll: true
  maxIncomingConnections: 200
security:
  authorization: enabled
operationProfiling:
  mode: "off"
  slowOpThresholdMs: 200
  slowOpSampleRate: 0.1
# No file log destination: structured server logs go to Docker stdout.
# Journaling is enabled by MongoDB 8.0; do not use removed journal.enabled.
